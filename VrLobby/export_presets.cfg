; The release ships the lobby exported (scripts\release.ps1): VrLobby.exe, VrLobby.pck and its .NET in
; data_VrLobby_windows_x86_64, so players need neither the Godot editor nor a first-run asset import.
; Export templates for this Godot version must be installed where the release is built.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Read as raw files at run time (Godot.FileAccess), not as imported resources: the window icon and the bundled
; default cabinet (without it, the drawn cabinet). The fonts' licences go along with them. The fonts themselves
; are packed imported, and loaded that way (Main.LoadFont).
include_filter="cabinet/*.cab, fonts/*.txt, icon.png"
; The README's screenshots aren't used by the lobby.
exclude_filter="screenshot*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
; 2 = always: VrLobby.console.exe passes the headless runs' output (PREPARE TABLES, --selftest) on to a pipe.
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
; No rcedit needed on the build machine; the window icon is set at run time (Main.SetWindowIcon).
application/modify_resources=false
application/product_name="VR Pinball Lobby"
application/file_description="VR Table Manager's VR lobby"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
